services:
  voc-studio:
    build: .
    ports:
      - "4200:4200"
    volumes:
      # Persist HuggingFace model cache (~3.5 GB per model, downloaded on first use)
      - hf_cache:/root/.cache/huggingface
      # Persist user data
      - ./data/uploads:/voc-studio/app/uploads
      - ./data/designed_voices:/voc-studio/designed_voices
      - ./data/clone_voices:/voc-studio/clone_voices
      - ./data/lora_models:/voc-studio/lora_models
      - ./data/lora_datasets:/voc-studio/lora_datasets
      - ./data/dataset_builder:/voc-studio/dataset_builder
      - ./data/scripts:/voc-studio/scripts
      # Persist audiobook output
      - ./data/output:/voc-studio/voicelines
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  hf_cache:
