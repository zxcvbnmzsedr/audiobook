[project]
name = "voc-studio"
version = "0.1.0"
description = "AI audiobook generator built with FastAPI and Qwen3-TTS"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.128.0",
    "uvicorn==0.40.0",
    "pydantic==2.12.5",
    "pydub==0.25.1",
    "requests==2.33.0",
    "openai==2.16.0",
    "gradio-client==2.0.3",
    "soundfile==0.13.1",
    "numpy==2.2.6",
    "librosa==0.11.0",
    "torch==2.7.0",
    "torchvision==0.22.0",
    "torchaudio==2.7.0",
    "transformers==4.57.3",
    "peft==0.18.1",
    "python-multipart==0.0.26",
    "aiofiles==24.1.0",
    "qwen-tts==0.1.1",
    "langchain>=1.3.1",
    "langchain-anthropic>=1.4.3",
    "jsonschema>=4.26.0",
    "langchain-openai>=1.1.0",
    "edge-tts>=7.0.0",
    "dashscope>=1.22.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
